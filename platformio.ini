; PlatformIO project for smalltv-mod
; Four board targets, all a 1.54" 240x240 ST7789 IPS display:
;   env:smalltv           GeekMagic SmallTV,     ESP-12F (ESP8266)
;   env:smalltv_c2        knockoff SmallTV,      ESP32-C2 / ESP8684 (flashed over USB-C/CH340C)
;   env:smalltv_esp32     NMMiner NM-TV-154,     classic ESP32 (WROOM-32E)
;   env:smalltv_esp32_8mb GeekMagic SmallTV Pro, classic ESP32, 8 MB flash
;
; Build one:       pio run -e smalltv   /  pio run -e smalltv_c2  /  pio run -e smalltv_esp32
; Build artifact:  .pio/build/<env>/firmware.bin
; Flash via USB:   pio run -e <env> -t upload
; Flash via OTA:   upload firmware.bin through the device web UI (System tab)
;
; License: WTFPL

[platformio]
default_envs = smalltv

; Shared by every firmware env (not the loader, which compiles only loader.cpp).
[common]
; Feature folders on the include path so cross-module quote-includes resolve.
; These MUST be build_src_flags (project sources only), not build_flags — a global
; -Isrc leaks into the framework build and, on the ESP32 IDF, shadows internal
; headers like net.h/config.h (case-insensitively on Windows), breaking the build.
build_src_flags =
	-iquote src
	-iquote src/features/usage

lib_deps =
	bblanchon/ArduinoJson @ ^7.4.0
	moononournation/GFX Library for Arduino @ ^1.5.0

; The ESP32 family (C2, classic ESP32, SmallTV Pro) uses the pioarduino fork of
; the Espressif platform (Arduino core 3.x / ESP-IDF 5.x); the official one has no
; C2 support. The pin lives here once and every ESP32 env interpolates it.
; The `stable` URL moved to 55.03.312, which requires PlatformIO Core >=6.2.0 and
; conflicts with the 6.1.19 pin in .github/workflows/build.yml (see the SCons note
; there). Lift both pins together.
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

[env:smalltv]
platform = espressif8266
board = esp12e
framework = arduino

; ESP-12F on the SmallTV carries 4MB flash. Layout: 1MB LittleFS, rest for
; sketch + OTA (OTA needs room for two sketch copies).
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
extra_scripts = pre:extra_script.py

monitor_speed = 115200
upload_speed = 921600

; Low-memory lwIP variant leaves more heap for BearSSL (the optional HTTPS view
; poll) and the framebuffer-less display rendering. Bandwidth is irrelevant for
; the small JSON payloads here.
build_flags =
	-D SMALLTV_ESP8266
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0

build_src_flags = ${common.build_src_flags}

lib_deps = ${common.lib_deps}

; ---------------------------------------------------------------------------
; Minimal OTA loader (src/loader.cpp). A tiny WiFi + web-OTA image, small
; enough to slip through a stock firmware whose updater rejects the full image
; for lack of space (e.g. the GeekMagic SmallTV-ultra). Flash it over the stock
; OTA, then flash the real firmware over the loader's /update. Pass WiFi at
; build time: -DLOADER_SSID='"MyNet"' -DLOADER_PASS='"secret"' (else it opens a
; SmallTV-Loader AP). build_src_filter compiles ONLY the loader.
; ---------------------------------------------------------------------------
[env:smalltv_loader]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
	-D LOADER_BUILD
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
build_src_filter = -<*> +<loader.cpp>

; ---------------------------------------------------------------------------
; ESP32-C2 / ESP8684 knockoff. Official espressif32 doesn't support the C2, so
; use the pioarduino fork (Arduino core 3.x / ESP-IDF 5.x). 4 MB flash: two OTA
; app slots + ~0.9 MB LittleFS (see partitions/smalltv_4mb_ota.csv). Flashed over
; the onboard CH340C on the USB-C port (auto-reset works, no button needed).
;
; All three ESP32 envs pin pioarduino 55.03.311 (Arduino 3.3.11). The `stable`
; URL moved to 55.03.312, which requires PlatformIO Core >=6.2.0 and conflicts
; with the 6.1.19 pin in .github/workflows/build.yml (see the SCons note there).
; ---------------------------------------------------------------------------
[env:smalltv_c2]
platform = ${esp32_base.platform}
board = esp32-c2-devkitm-1
framework = arduino
extra_scripts = pre:extra_script.py

board_build.filesystem = littlefs
board_build.partitions = partitions/smalltv_4mb_ota.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; PlatformIO's bundled esptool hangs entering download mode on this board's CH340C.
; Flash the merged image with the system esptool instead (its auto-reset works).
; Needs a system Python with esptool installed (`pip install esptool`).
upload_protocol = custom
upload_command = python -m esptool --chip esp32c2 --baud 921600 write_flash 0x0 "$BUILD_DIR/firmware.factory.bin"

; SIZE NOTE. The last four flags keep the 4 MB boards inside their 1,572,864 B
; OTA slot, which cannot grow (see [env:smalltv_esp32]). They reach everything
; PlatformIO compiles here: src/, the lib_deps and the Arduino core and
; libraries. The prebuilt ESP-IDF libraries are not affected.
;   CORE_DEBUG_LEVEL=0 compiles out the Arduino core's log_e() and friends,
;     serial-console diagnostics only. The firmware's own Serial output stays.
;   -fno-exceptions and the two unwind-table flags drop the C++ landing pads,
;     .gcc_except_table and .eh_frame. Nothing in this build catches an
;     exception: there is no try/catch in src/, the lib_deps or the Arduino
;     sources compiled here (a try block would not compile with the flag). A
;     throw from the prebuilt libstdc++, e.g. std::bad_alloc out of a growing
;     std::string, ended in std::terminate and a reboot before and still does.
; They apply to all ESP32 envs, so the images stay built the same way.
build_flags =
	-D SMALLTV_ESP32C2
	-D ARDUINOJSON_USE_DOUBLE=0
	; Image size: see the size note in [env:smalltv_c2].
	-D CORE_DEBUG_LEVEL=0
	-fno-exceptions
	-fno-asynchronous-unwind-tables
	-fno-unwind-tables

; pioarduino custom sdkconfig: rebuild the prebuilt IDF libs without Bluetooth.
; The app uses no BT/BLE at all (zero references in src/). gc-sections already
; dead-strips most of the BT blob code from the image, so the flash win is only
; a few KB — the real win on the C2 is RAM: with BT off, the linker's ~50 KB BT
; controller DRAM reservation goes away. libmesh/libsmartconfig are closed-source
; esp_wifi blobs with no kconfig gate, so they can't be removed this way.
; CAVEAT: pioarduino keeps ONE sdkconfig.defaults per project (hash includes the
; MCU) and wipes + reinstalls + recompiles the whole Arduino/IDF framework
; (~20-40 min) whenever the hash or the custom/non-custom state changes, so
; alternating builds between this env and env:smalltv_esp32_8mb (stock libs)
; re-triggers that rebuild every time. Batch builds per MCU.
; The FMB_MASTER_MAX_API_BLOCKING_TIME_MS pin is NOT a feature choice: the
; custom-sdkconfig path runs a full kconfig pass that DEFINES this esp-modbus
; option at its Kconfig default 6000 (the stock prebuilt-headers build leaves
; it undefined). Only the classic-ESP32 template's FMB_MASTER_TIMEOUT_MS_RESPOND=
; 10000 makes that trip a _Static_assert in managed_components/espressif__esp-modbus
; (the C2 template sets 3000, where the default is legal) — pinned here too so
; the two custom-sdkconfig envs stay symmetric.
custom_sdkconfig =
	CONFIG_BT_ENABLED=n
	CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000

build_src_flags = ${common.build_src_flags}

lib_deps = ${common.lib_deps}

; ---------------------------------------------------------------------------
; GeekMagic SmallTV Pro: classic ESP32 (esp32dev), 8 MB flash, same 1.54"
; ST7789V panel on different pins (see src/board_esp32_pro.h; pin map from the
; ESPHome SmallTV Pro config). Copy of env:smalltv_esp32 with the flash
; size raised to 8 MB and the stock SmallTV Pro partition layout (2.125 MB per
; OTA app slot + ~3.7 MB LittleFS, verified from a live device; see
; partitions/smalltv_8mb_ota.csv) so OTA offsets match stock firmware.
; SMALLTV_ESP32 selects the chip-family code paths, SMALLTV_ESP32_PRO the board
; pin map + update asset.
; No USB-serial chip (USB-C is power only). First install: upload firmware.bin
; via the STOCK web UI's /update (partition layout matches stock, so it fits),
; or wire a 3.3 V UART adapter to the internal header and flash
; firmware.factory.bin at 0x0.
; ---------------------------------------------------------------------------
[env:smalltv_esp32_8mb]
platform = ${esp32_base.platform}
board = esp32dev
framework = arduino
extra_scripts = pre:extra_script.py

; esp32dev defaults to 4 MB; override for the 8 MB module.
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

board_build.filesystem = littlefs
board_build.partitions = partitions/smalltv_8mb_ota.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; The 8 MB board has larger OTA slots than the 4 MB classic ESP32.
build_flags =
	-D SMALLTV_ESP32
	-D SMALLTV_ESP32_PRO
	-D ARDUINOJSON_USE_DOUBLE=0
	; Image size: see the size note in [env:smalltv_c2].
	-D CORE_DEBUG_LEVEL=0
	-fno-exceptions
	-fno-asynchronous-unwind-tables
	-fno-unwind-tables

build_src_flags = ${common.build_src_flags}

lib_deps = ${common.lib_deps}

; ---------------------------------------------------------------------------
; NMMiner NM-TV-154 ("NM-TV-Miner" PCB): classic ESP32 (ESP32-D0WD-V3 in a
; WROOM-32E, 40 MHz crystal), same 1.54" ST7789 panel. Confirmed working on
; hardware by a community tester (issue #1); pin map from the vendor's
; custom-firmware guide. Same pioarduino platform as the C2 so both ESP32
; targets get Arduino core 3.x (Platform.h's ESP32 branch needs it). 4 MB
; flash (confirmed): same two-OTA-slots + LittleFS layout as the C2.
; First flash over USB: esptool write_flash 0x0 firmware.factory.bin
; ---------------------------------------------------------------------------
[env:smalltv_esp32]
platform = ${esp32_base.platform}
board = esp32dev
framework = arduino
extra_scripts = pre:extra_script.py

board_build.filesystem = littlefs
board_build.partitions = partitions/smalltv_4mb_ota.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; The classic ESP32's framework libraries cost more than the C2's, so on the
; same 1,572,864 B OTA slot this is the tighter fit. Whatever is left in this
; slot is all this board has for future growth.
build_flags =
	-D SMALLTV_ESP32
	-D ARDUINOJSON_USE_DOUBLE=0
	; Image size: see the size note in [env:smalltv_c2].
	-D CORE_DEBUG_LEVEL=0
	-fno-exceptions
	-fno-asynchronous-unwind-tables
	-fno-unwind-tables

; pioarduino custom sdkconfig: rebuild the prebuilt IDF libs without Bluetooth —
; same rationale and the same framework-rebuild caveat as in [env:smalltv_c2].
; The app uses no BT/BLE (zero references in src/).
; The FMB_MASTER_MAX_API_BLOCKING_TIME_MS pin is NOT a feature choice: the
; custom-sdkconfig path runs a full kconfig pass that DEFINES this esp-modbus
; option at its Kconfig default 6000 (the stock prebuilt-headers build leaves
; it undefined); 6000 < the Arduino template's FMB_MASTER_TIMEOUT_MS_RESPOND=
; 10000 trips a _Static_assert in managed_components/espressif__esp-modbus.
custom_sdkconfig =
	CONFIG_BT_ENABLED=n
	CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000

build_src_flags = ${common.build_src_flags}

lib_deps = ${common.lib_deps}
