<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmallTV device</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--mut:#8b96a5;--fg:#e6edf3;--acc:#3fb950;--acc2:#2f81f7;--bd:#262d38;--red:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
button{font:inherit;background:var(--acc);color:#04130a;border:0;padding:7px 11px;border-radius:8px;font-weight:650;cursor:pointer}
button.sec{background:#222b36;color:var(--fg)}
input,select{width:100%;padding:7px 9px;background:#0b0e13;border:1px solid var(--bd);border-radius:8px;color:var(--fg);font-size:14px}
label{display:block;margin:8px 0 4px;font-size:12px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.bar h1{font-size:16px;margin:0 12px 0 0;white-space:nowrap}
.bar .grow{flex:1;min-width:180px}
.bar input{width:auto}
.devices{display:flex;gap:6px;overflow:auto;padding:8px 14px;border-bottom:1px solid var(--bd)}
.dev{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;white-space:nowrap;background:#141a22}
.dev.sel{border-color:var(--acc2)}
.dev small{display:block;color:var(--mut);font-size:11px}
.panel{padding:8px 14px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:end;flex-wrap:wrap;background:#11161d}
.panel>div{min-width:130px;flex:1}
.panel .actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.hint{color:var(--mut);font-size:12px}
#frame{width:100%;height:calc(100vh - 154px);border:0;background:#0e1116}
.status{font-size:12px;color:var(--mut);margin-left:auto}
a{color:var(--acc2)}
</style>
</head>
<body>
<div class="bar">
 <h1>SmallTV device</h1>
 <button class="sec" type="button" onclick="discover()">Scan</button>
 <button class="sec" type="button" onclick="reloadDeviceUi()">Reload device</button>
 <a href="/editor" id="editorLink"><button type="button">Open dashboard editor</button></a>
 <span class="status" id="status">select a device</span>
</div>
<div class="devices" id="list"><span class="hint">Scanning...</span></div>
<div class="panel">
 <div><label>Device URL</label><input id="url" type="url" placeholder="http://192.168.8.110"></div>
 <div><label>Web UI user</label><input id="user" type="text" autocomplete="username" placeholder="(only if enabled)"></div>
 <div><label>Web UI password</label><input id="pass" type="password" autocomplete="current-password" placeholder="(only if enabled)"></div>
 <div class="actions"><button type="button" onclick="applyTarget()">Use device</button><button class="sec" type="button" onclick="saveAuth()">Auth</button></div>
</div>
<iframe id="frame" src="about:blank" title="SmallTV device web interface"></iframe>
<script>
let devices=[];
function $(id){return document.getElementById(id)}
function status(m){$('status').textContent=m||''}
function target(){return ($('url').value||'').trim().replace(/\/$/,'')}
function setFrame(){
 const base=target();
 if(!base){$('frame').src='about:blank';return}
 $('frame').src='/device-ui?t='+Date.now();
 $('editorLink').href='/editor?device='+encodeURIComponent(location.origin);
}
async function api(path,opt){const r=await fetch(path,opt);const t=await r.text();let d={};try{d=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error(d.error||t||('HTTP '+r.status));return d}
async function applyTarget(){
 const base=target();if(!base)return status('enter a device URL');
 try{await api('/api/local/target',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:base})});setFrame();status('using '+base)}catch(e){status('failed: '+e.message)}
}
async function saveAuth(){
 try{await api('/api/local/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:($('user').value||'').trim(),pass:$('pass').value})});setFrame();status('auth saved for this session')}catch(e){status('auth failed: '+e.message)}
}
function selectDevice(d){
 $('url').value='http://'+d.ip;
 status(d.auth?'auth required — enter web UI user/password':(d.version||'device')+' at '+d.ip);
 applyTarget();
}
function renderDevices(){
 $('list').innerHTML='';
 devices.forEach(d=>{
  const el=document.createElement('div');el.className='dev';el.onclick=()=>selectDevice(d);
  el.innerHTML='<b>'+esc(d.name||d.ip)+'</b><small>'+esc(d.ip)+(d.version?' · '+esc(d.version):'')+(d.auth?' · auth':'')+'</small>';
  $('list').appendChild(el);
 });
 if(!devices.length)$('list').innerHTML='<span class="hint">No SmallTV found. Enter the IP manually.</span>';
}
async function discover(){
 devices=[];renderDevices();status('scanning...');
 try{
  const data=await api('/api/local/discover');
  devices=data.devices||[];
  renderDevices();
  if(devices.length&&!target())selectDevice(devices[0]);
  status(devices.length?devices.length+' device(s)':'no devices');
  if(data.scanning){
   status('scanning local network... '+(devices.length?devices.length+' found':''));
   setTimeout(async()=>{
    try{const d=await api('/api/local/discover');devices=d.devices||[];renderDevices();if(devices.length&&!target())selectDevice(devices[0]);if(d.scanning)setTimeout(()=>discover(),1000);else status(devices.length?devices.length+' device(s)':'no devices')}catch(e){status('scan failed')}
   },1000);
  }
 }catch(e){$('list').innerHTML='<span class="hint">Scan failed: '+esc(e.message)+'</span>';status('scan failed')}
}
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
$('editorLink').href='/editor?device='+encodeURIComponent(location.origin);
discover();
</script>
</body>
</html>
